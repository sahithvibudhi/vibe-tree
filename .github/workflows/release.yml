name: Build and Release

on:
  push:
    tags:
      - 'v*'
  # Dispatch with a tag name to cut a release from environments that cannot
  # push tags; the tag itself is created when the draft release is published
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create on publish (e.g. v0.2.0)'
        required: false
        default: ''
      notes:
        description: 'Release notes body (markdown)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        include:
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      # The node-gyp bundled with pnpm 8 does not recognize the Visual Studio
      # version on current windows-latest images; use an up-to-date one
      - name: Use current node-gyp (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          npm install -g node-gyp@latest
          "npm_config_node_gyp=$(npm root -g)\node-gyp\bin\node-gyp.js" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install setuptools for Python (macOS)
        if: matrix.os == 'macos-latest'
        run: pip install setuptools

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        timeout-minutes: 10

      - name: Build
        run: pnpm build
        timeout-minutes: 10

      - name: Rebuild native dependencies
        run: |
          npx electron-rebuild
        shell: bash

      - name: Build executables
        run: pnpm package:desktop
        timeout-minutes: 20

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-executables
          path: |
            release/*.dmg
            release/*.AppImage
            release/*.exe
            release/*.deb
            release/*.rpm
            release/*.zip
            release/*.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            mac-executables/*
            linux-executables/*
            win-executables/*
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          body: ${{ inputs.notes }}
          draft: true
          prerelease: false
          generate_release_notes: ${{ inputs.notes == '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
